<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batcave — Tableau de bord</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="card dashboard">
        <header class="dashboard-header">
            <h1>Tableau de bord</h1>
            <button id="logoutBtn" class="btn-secondary">Déconnexion</button>
        </header>

        <section id="profileSection">
            <h2>Profil</h2>
            <p>Chargement...</p>
        </section>

        <section id="actionsSection">
            <h2>Actions</h2>
            <button id="refreshProfileBtn">Recharger le profil</button>
            <button id="batmobileBtn">Accéder à la Batmobile</button>
        </section>

        <section id="twoFASection" class="hidden">
            <h2>Validation 2FA (Alfred)</h2>
            <p>Entrez le code secret reçu par Alfred : <code>BATCAVE42</code></p>
            <input type="text" id="twoFACode" placeholder="Code 2FA">
            <button id="verify2FABtn">Valider 2FA</button>
        </section>

        <section id="batmobileSection" class="hidden">
            <h2>Commandes Batmobile</h2>
            <pre id="batmobileData"></pre>
        </section>

        <section id="passwordSection">
            <h2>Modifier le mot de passe</h2>
            <form id="changePasswordForm">
                <label for="oldPassword">Ancien mot de passe</label>
                <input type="password" id="oldPassword" required>

                <label for="newPassword">Nouveau mot de passe</label>
                <input type="password" id="newPassword" required>

                <button type="submit">Changer le mot de passe</button>
            </form>
            <p id="passwordMessage" class="hidden"></p>
        </section>
    </main>

    <script src="/dashboard.js"></script>
</body>
</html>
