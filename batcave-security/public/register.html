<!DOCTYPE html>
<html lang="fr-FR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription — Batcave</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-dark text-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
      <div class="container">
        <a class="navbar-brand" href="#"><i class="fa-solid fa-bat"></i> Batcave</a>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="register.html">S'inscrire</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/bat-computer">Bat-Ordinateur</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/logout">Se déconnecter</a>
          </li>
        </ul>
      </div>
    </nav>

    <main class="container py-5" style="max-width: 480px">
      <h1 class="mb-4">Registre des Justiciers</h1>
      <form id="register-form" class="card bg-secondary bg-opacity-25 border-secondary p-4">
        <div class="mb-3">
          <label for="username" class="form-label">Nom d'utilisateur</label>
          <input
            type="text"
            id="username"
            class="form-control"
            placeholder="BruceWayne"
            required
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Mot de passe</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="8 caractères minimum"
            required
            minlength="8"
          />
        </div>
        <button type="submit" class="btn btn-warning w-100">S'inscrire</button>
        <p id="message" class="mt-3 mb-0"></p>
      </form>
      <p class="mt-3 text-secondary">
        Déjà enregistré ?
        <a href="/bat-computer" class="link-warning">Accéder au Bat-Ordinateur</a>
      </p>
    </main>

    <script src="register.js"></script>
  </body>
</html>
