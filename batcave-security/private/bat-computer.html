<!DOCTYPE html>
<html lang="fr-FR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bat-Ordinateur</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      .arsenal-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1rem;
      }
      .gadget-card {
        transition: transform 0.2s;
      }
      .gadget-card:hover {
        transform: translateY(-4px);
      }
      .gadget-icon {
        font-size: 2rem;
        color: #ffc107;
      }
    </style>
  </head>
  <body class="bg-dark text-light">
    <nav class="navbar navbar-dark bg-black border-bottom border-secondary">
      <div class="container">
        <span class="navbar-brand"><i class="fa-solid fa-computer"></i> Bat-Ordinateur</span>
        <div class="d-flex gap-3">
          <a class="nav-link" href="/register.html">Registre</a>
          <a class="nav-link" href="/logout">Se déconnecter</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <header class="mb-4">
        <h1 id="welcome" class="h3">Chargement...</h1>
        <p class="text-secondary">Accès sécurisé — Protocole Basic Auth</p>
      </header>

      <section class="mb-5">
        <h2 class="h4 mb-3"><i class="fa-solid fa-box-open"></i> Arsenal dynamique</h2>
        <div id="arsenal" class="arsenal-grid"></div>
      </section>

      <section>
        <h2 class="h4 mb-3"><i class="fa-solid fa-file-lines"></i> Rapport de mission</h2>
        <form id="report-form" class="card bg-secondary bg-opacity-25 border-secondary p-4">
          <div class="mb-3">
            <label for="report-content" class="form-label">Note de mission</label>
            <textarea
              id="report-content"
              class="form-control"
              rows="3"
              placeholder="Décrivez votre intervention..."
              required
            ></textarea>
          </div>
          <button type="submit" class="btn btn-warning">Envoyer le rapport</button>
          <p id="report-message" class="mt-3 mb-0"></p>
        </form>
      </section>
    </main>

    <script>
      function getAuthHeader () {
        const stored = sessionStorage.getItem('batcave_auth')
        if (stored) return stored

        const username = prompt("Nom d'utilisateur :")
        const password = prompt('Mot de passe :')
        if (!username || !password) return null

        const header = 'Basic ' + btoa(username + ':' + password)
        sessionStorage.setItem('batcave_auth', header)
        return header
      }

      function authFetch (url, options = {}) {
        const authHeader = getAuthHeader()
        if (!authHeader) {
          return Promise.reject(new Error('Authentification annulée'))
        }

        const headers = new Headers(options.headers || {})
        headers.set('Authorization', authHeader)
        if (options.body && !headers.has('Content-Type')) {
          headers.set('Content-Type', 'application/json')
        }

        return fetch(url, { ...options, headers })
      }

      async function loadProfile () {
        const response = await authFetch('/api/me')
        if (response.status === 403) throw new Error('Accès refusé — rôle ADMIN requis')
        if (!response.ok) throw new Error('Impossible de charger le profil')
        const user = await response.json()
        document.getElementById('welcome').textContent =
          'Bienvenue, Justicier ' + user.username
      }

      async function loadArsenal () {
        const response = await authFetch('/api/secrets')
        if (!response.ok) throw new Error('Impossible de charger l\'arsenal')
        const gadgets = await response.json()
        const container = document.getElementById('arsenal')
        container.innerHTML = ''

        gadgets.forEach(gadget => {
          const card = document.createElement('div')
          card.className = 'card gadget-card bg-secondary bg-opacity-25 border-secondary'
          card.innerHTML = `
            <div class="card-body text-center">
              <i class="fa-solid ${gadget.icon} gadget-icon mb-2"></i>
              <h3 class="card-title h5">${gadget.name}</h3>
              <p class="card-text text-secondary">${gadget.desc}</p>
            </div>
          `
          container.appendChild(card)
        })
      }

      document.getElementById('report-form').onsubmit = async e => {
        e.preventDefault()
        const content = document.getElementById('report-content').value
        const messageEl = document.getElementById('report-message')

        try {
          const response = await authFetch('/api/reports', {
            method: 'POST',
            body: JSON.stringify({ content })
          })

          const data = await response.json().catch(() => ({}))

          if (response.ok) {
            messageEl.className = 'mt-3 mb-0 text-success'
            messageEl.textContent = data.message || 'Rapport enregistré.'
            document.getElementById('report-form').reset()
          } else {
            messageEl.className = 'mt-3 mb-0 text-danger'
            messageEl.textContent = data.message || 'Erreur lors de l\'envoi.'
          }
        } catch {
          messageEl.className = 'mt-3 mb-0 text-danger'
          messageEl.textContent = 'Authentification requise.'
        }
      }

      Promise.all([loadProfile(), loadArsenal()]).catch(err => {
        document.getElementById('welcome').textContent = err.message
      })
    </script>
  </body>
</html>
