<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batcave — Tableau de bord</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="card dashboard">
        <header class="dashboard-header">
            <h1>Tableau de bord</h1>
            <button id="logoutBtn" class="btn-secondary" type="button">Déconnexion</button>
        </header>

        <section id="profileSection">
            <h2>Profil (jeton d'identité OIDC)</h2>
            <div class="profile">
                <img id="avatar" class="avatar hidden" alt="Avatar Google">
                <div>
                    <p><strong id="userName">…</strong></p>
                    <p class="subtitle" id="userEmail">…</p>
                    <p class="hint" id="userSub"></p>
                </div>
            </div>
        </section>

        <section>
            <h2>Session locale</h2>
            <p class="hint">
                Après décodage de l'<code>id_token</code>, une session Express a été créée.
                Le <code>access_token</code> Google n'est pas conservé : il servirait uniquement
                à appeler les API Google (serveur de ressources).
            </p>
        </section>

        <p id="errorMessage" class="error hidden"></p>
    </main>
    <script src="/dashboard.js"></script>
</body>
</html>
