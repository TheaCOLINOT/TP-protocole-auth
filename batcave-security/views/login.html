<!DOCTYPE html>
<html lang="fr-FR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — Batcave</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
      <div class="container-fluid">
        <span class="navbar-brand">🦇 Batcave Security</span>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/auth/register">S'inscrire</a>
          </li>
        </ul>
      </div>
    </nav>
    <main class="container mt-5" style="max-width: 420px">
      <h1 class="mb-4">Connexion</h1>
      <form method="POST" action="/auth/login">
        <div class="mb-3">
          <label for="username" class="form-label">Nom d'utilisateur</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            placeholder="bruce"
            required
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Mot de passe</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="••••••••"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-100">
          Se connecter
        </button>
      </form>
      <p class="mt-3 text-center">
        Pas encore de compte ?
        <a href="/auth/register">S'inscrire</a>
      </p>
    </main>
  </body>
</html>
